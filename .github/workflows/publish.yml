name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python }}
      - name: Run full test suite
        run: uv run --extra dev pytest tests/

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          INIT=$(grep -Po '(?<=^__version__ = ")[^"]*' src/groundhog/__init__.py)
          echo "tag=$TAG __init__=$INIT"
          test "$TAG" = "$INIT" || { echo "::error::tag v$TAG != package version $INIT (single source: src/groundhog/__init__.py)"; exit 1; }

  publish:
    needs: [test, version-check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
