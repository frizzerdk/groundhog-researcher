[project]
name = "groundhog-researcher"
dynamic = ["version"]
description = "LLM-powered iterative function optimization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["llm", "optimization", "iteration", "code-generation", "ai", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "python-dotenv",
]

[project.scripts]
groundhog = "groundhog.cli:main"
ghg = "groundhog.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[tool.hatch.version]
path = "src/groundhog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/groundhog"]

[project.urls]
Homepage = "https://github.com/frizzerdk/groundhog-researcher"
Repository = "https://github.com/frizzerdk/groundhog-researcher"
Issues = "https://github.com/frizzerdk/groundhog-researcher/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start conservative: correctness + hygiene classes only. Style expansion later.
select = [
    "E4",   # imports
    "E7",   # statement correctness (comparison, lambda assignment, ...)
    "E9",   # syntax/indentation errors
    "F",    # pyflakes: undefined names, unused imports/variables, ...
    "B",    # bugbear: likely bugs (mutable defaults, unused loop vars, ...)
]
ignore = [
    "E731", # lambda assignments are used deliberately (toolkit wiring)
    # Deferred to a post-refactor style pass (2026-07): mechanical but churny.
    "B904", # raise ... from err inside except
    "E741", # ambiguous single-letter names (l, O) in algorithm code
]

[tool.ruff.lint.per-file-ignores]
# Package façades: re-exports ARE the public API (`from groundhog import *`).
"src/groundhog/__init__.py" = ["F401", "E402"]
"src/groundhog/base/__init__.py" = ["F401"]
# Templates are illustrative scaffolds: dotenv-before-imports is the documented
# pattern, "unused" locals show the user where their code goes, and imports
# may serve commented-out worked examples.
"src/groundhog/templates/*" = ["E402", "F841", "F401"]
"examples/*" = ["E402"]
